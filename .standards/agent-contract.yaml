# agent-contract.yaml — V9 最小公共契约
# 每个 agent 声明身份、平台、状态路径、Hook 与模型降级策略。
# 本文件是 agents-registry.md 的结构化补充，不替代它。
#
# 版本: 1.0.0 | 创建: 2026-05-31 | 息壤 V9.2
# 任务: T-20260531-18

agents:
  - agent_id: claudian
    platform: claude-code
    status_path: "02-项目管理/智能体状态/Claudian.md"
    hook_support:
      - pre-write    # pre-write-hook.sh, blocking
      - post-write   # post-write-hook.sh, audit
      - session-guard # session-guard.sh, advisory
    fallback_model:
      primary: opus
      chain: [sonnet, haiku]
      auto_fallback: false

  - agent_id: xiaochong
    platform: openclaw
    status_path: "02-项目管理/智能体状态/阿莫西林.md"
    hook_support:
      - task-start   # v8-runtime/scripts/task-start.sh, 手动调用
      - task-end     # v8-runtime/scripts/task-end.sh, 手动调用
      - heartbeat    # v8-runtime/scripts/heartbeat.sh, agent 主动调用
      # v8-watchdog cron 已于 2026-07-18 退役；V9 反射器只读检查 heartbeat，禁止旧脚本自动改状态/发消息。
    fallback_model:
      primary: o3
      chain: [o4-mini]
      auto_fallback: false

  - agent_id: toubao
    platform: hermes
    status_path: "02-项目管理/智能体状态/头孢.md"
    hook_support: []  # hooks/ 目录存在但为空，待验证平台是否支持
    compliance_mode: manual_compliance_required
    fallback_model:
      primary: deepseek-v4-pro
      chain: [deepseek-v4]
      auto_fallback: false

  - agent_id: hongmeisu
    platform: codex
    status_path: "02-项目管理/智能体状态/红霉素.md"
    hook_support:
      - pre-write     # Codex apply_patch/Write/Edit，经 codex-hook-adapter 阻断
      - post-write    # 写入事件归属 hongmeisu/codex
      - session-guard # exec_command 继续匹配 Bash
      - session-start
      - session-stop
    fallback_model:
      primary: gpt-5.5
      chain: [o4-mini]
      auto_fallback: false

  - agent_id: workbuddy
    platform: codebuddy
    status_path: "02-项目管理/智能体状态/WorkBuddy.md"
    hook_support: []  # 待验证
    compliance_mode: manual_compliance_required
    fallback_model:
      primary: null  # 平台内置模型
      chain: []
      auto_fallback: false

# 契约字段说明:
#   agent_id:          唯一标识符，与 v8-handshake.sh 中 _v8_resolve_status_file 对齐
#   platform:          运行平台名称
#   status_path:       状态文件相对路径（相对于 vault root）
#   hook_support:      平台支持的 hook 类型列表（空=无 hook）
#   compliance_mode:   仅 hook_support 为空时填写，标记为 manual_compliance_required
#   fallback_model:    模型降级配置
#     primary:         主模型
#     chain:           降级链（按优先级排列）
#     auto_fallback:   是否允许平台在模型不可用时自动降级（默认 false）
