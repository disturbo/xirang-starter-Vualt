# task-card-schema.yaml — V8.5 任务卡 schema 定义
# 位置: _temp/{task_id}/task-card.yaml
# 用途: v8_handshake 创建，pre-write-hook 读取验证
# 版本: 1.0.0 | 2026-05-26

# --- 示例 ---
# task_id: T-20260526-80
# agent: claudian
# gear: M4
# task: "V8强制门禁Phase2"
# authorized_paths:
#   - ".standards/hooks/"
#   - ".standards/v8-closeout-check.py"
#   - ".standards/gate-enforce.py"
# scope_source: handshake   # handshake | manual | user_override
# created_at: "2026-05-26T10:00:00+08:00"
# reviewer: "用户"

# --- 字段说明 ---
# task_id:          string, required — 任务 ID
# agent:            string, required — 执行 Agent ID
# gear:             enum(M4,M5), required — 档位
# task:             string, required — 任务名称
# authorized_paths: list[string], required — 授权写入路径（目录以/结尾，文件为精确路径）
# scope_source:     enum(handshake,manual,user_override), required — 授权来源
# created_at:       string(ISO datetime), required — 创建时间
# reviewer:         string, optional — 验收方
